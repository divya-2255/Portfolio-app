<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback | Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">PORTFOLIO</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="feedback.html" class="active">Feedback</a>
    </nav>
  </header>

  <div class="page">
    <div class="section">
      <h2>Leave Feedback</h2>
      <form id="fbForm">
        <label>Your Name<input id="fbName" required></label>
        <label>Message<textarea id="fbMessage" required maxlength="500" placeholder="Share your thoughts about this portfolio"></textarea></label>
        <button type="submit">Submit Feedback</button>
        <p id="fbStatus" class="msg"></p>
      </form>
    </div>

    <div class="section">
      <h2>Feedback Received</h2>
      <div id="fbList"><p>Loading...</p></div>
    </div>
  </div>

  <footer>&copy; 2026 Portfolio. All rights reserved.</footer>
  <script src="feedback.js"></script>
</body>
</html>
